    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #ffdde1;
        font-family: "Comic Sans MS", cursive, sans-serif;
        text-align: center;
        overflow: hidden;
      }

      .message-container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding-bottom: 20px;
        animation: bounce 2s infinite alternate ease-in-out;
      }

      #message {
        font-size: 50px;
        font-weight: bold;
        padding: 20px;
        background: white;
        border-radius: 30px;
        text-align: center;
        display: inline-block;
        max-width: 80%;
        position: relative;
        box-shadow: 0 0 40px rgba(255, 20, 147, 0.9);
      }

      #message::after {
        content: "";
        position: absolute;
        bottom: -20px;
        left: 50%;
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 20px solid white;
        transform: translateX(-50%);
      }

      #message span {
        background-image: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
        background-size: 300% auto; /* Augmente la taille pour un effet plus large */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        display: inline-block;
        animation: rainbowShift 5s infinite linear,
          fadeText 2s infinite alternate ease-in-out;
      }

      /* Effet arc-en-ciel amélioré */
      @keyframes rainbowShift {
        0% {
          background-position-x: 0%;
        }
        50% {
          background-position-x: 100%;
        }
        100% {
          background-position-x: 0%;
        }
      }

      /* Effet subtil de fondu pour rendre le texte vivant */
      @keyframes fadeText {
        0% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes bounce {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0);
        }
      }

      #toggle-lang {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 20, 147, 0.7);
        transition: transform 0.2s, background-color 0.3s;
      }

      #toggle-lang:hover {
        transform: scale(1.1);
        background-color: #ff1493;
      }

      /* Style général pour tous les boutons */
      /* Style général pour tous les boutons */
      .button-style {
        position: fixed;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 20, 147, 0.7);
        transition: transform 0.2s, background-color 0.3s;
        background-size: 200% auto;
      }

      /* Effet rainbow continu au hover */
      .button-style:hover {
        transform: scale(1.1);
        background-image: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
        background-size: 300% auto;
        animation: rainbowHover 3s infinite linear;
        color: white; /* Assure une bonne lisibilité */
      }

      /* Animation Rainbow qui boucle */
      @keyframes rainbowHover {
        0% {
          background-position: 0% center;
        }
        100% {
          background-position: 100% center;
        }
      }

      /* Bouton Refresh (Haut gauche) */
      #refresh-quote {
        top: 20px;
        left: 20px;
      }

      /* Bouton GitHub (Bas gauche) */
      #github-link {
        bottom: 20px;
        left: 20px;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
